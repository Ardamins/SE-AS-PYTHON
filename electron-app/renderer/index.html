<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HandsUp - Detector de Lenguaje de Senas</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height:100vh; padding:20px;
  }
  .container {
    max-width:1000px; margin:0 auto; background:rgba(255,255,255,.96);
    border-radius:20px; padding:30px; box-shadow:0 20px 40px rgba(0,0,0,.12);
  }
  h1 {
    text-align:center; margin-bottom:20px; font-size:2.3rem;
    background:linear-gradient(45deg,#667eea,#764ba2);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .panel {
    background:rgba(102,126,234,.08); border:2px solid rgba(102,126,234,.3);
    border-radius:15px; padding:18px; margin-bottom:20px;
  }
  .panel h3 { color:#333; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .row { display:flex; gap:12px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .row label { font-weight:600; color:#333; min-width:130px; }
  select, input[type=range] {
    flex:1; min-width:180px; padding:8px 10px; border-radius:8px;
    border:1px solid #ccc; font-size:1rem; background:white;
  }
  .threshold-badge {
    background:#667eea; color:white; padding:4px 10px; border-radius:12px;
    font-size:.85rem; min-width:50px; text-align:center;
  }
  .status {
    text-align:center; padding:12px; border-radius:10px; margin-bottom:18px;
    font-weight:bold; font-size:.95rem;
  }
  .status.loaded { background:rgba(76,175,80,.12); color:#2e7d32; border:2px solid #4caf50; }
  .status.not-loaded { background:rgba(255,107,107,.12); color:#c82333; border:2px solid #ff6b6b; }
  .status.loading { background:rgba(255,193,7,.15); color:#856404; border:2px solid #ffc107; }

  .gallery {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr));
    gap:10px; margin-top:10px; max-height:320px; overflow-y:auto; padding:4px;
  }
  .gallery-item {
    position:relative; cursor:pointer; border-radius:10px; overflow:hidden;
    border:3px solid transparent; transition:.2s; background:#f0f0f0;
    aspect-ratio:1/1;
  }
  .gallery-item:hover { border-color:#764ba2; transform:translateY(-2px); }
  .gallery-item.selected { border-color:#4caf50; box-shadow:0 0 0 3px rgba(76,175,80,.25); }
  .gallery-item img { width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-item .label {
    position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.65);
    color:white; font-size:.7rem; padding:2px 4px; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .gallery-item.error { opacity:.4; }
  .gallery-item.error::after {
    content:'X'; position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center; font-size:1.6rem;
    background:rgba(0,0,0,.35); color:white; font-weight:bold;
  }

  .upload-area {
    border:3px dashed #667eea; border-radius:15px; padding:26px 20px;
    text-align:center; cursor:pointer; transition:.25s;
    background:rgba(102,126,234,.04);
  }
  .upload-area:hover { border-color:#764ba2; background:rgba(118,75,162,.08); }
  .upload-area.dragover { border-color:#764ba2; background:rgba(118,75,162,.15); }
  .upload-area.disabled { opacity:.5; cursor:not-allowed; pointer-events:none; }
  .upload-icon { font-size:2.5rem; margin-bottom:8px; }
  .upload-text { font-size:1rem; color:#555; }

  .preview-container { text-align:center; margin:20px 0; }
  .preview-image {
    max-width:100%; max-height:380px; border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.2); display:none;
  }
  .loading {
    text-align:center; color:#667eea; font-size:1.05rem; display:none; margin:18px 0;
  }
  .loading::after { content:''; animation:dots 1.6s infinite; }
  @keyframes dots { 0%,20%{content:'';} 40%{content:'.';} 60%{content:'..';} 80%,100%{content:'...';} }
  .result {
    background:linear-gradient(45deg,#667eea,#764ba2); color:white;
    padding:26px; border-radius:15px; text-align:center; margin-top:18px;
    display:none; animation:slideIn .4s ease;
  }
  .result.rejected { background:linear-gradient(45deg,#ff6b6b,#ff8e53); }
  @keyframes slideIn { from{opacity:0;transform:translateY(15px);} to{opacity:1;transform:translateY(0);} }
  .result-letter { font-size:4rem; font-weight:bold; margin-bottom:8px; }
  .result-confidence { font-size:1.1rem; opacity:.95; }
  .warning {
    background:rgba(255,193,7,.18); border:1px solid #ffc107; color:#856404;
    padding:12px; border-radius:8px; margin-top:14px; font-size:.9rem;
    line-height:1.5; display:none;
  }
  .metrics {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:8px; margin-top:14px;
  }
  .metric {
    background:rgba(255,255,255,.9); color:#333; padding:8px;
    border-radius:8px; font-size:.85rem;
  }
  .metric b { display:block; font-size:1.05rem; }
  .error, .success {
    padding:15px; border-radius:10px; margin:15px 0; display:none;
    line-height:1.5; white-space:pre-line;
  }
  .error { background:#ff6b6b; color:white; }
  .success { background:#4ecdc4; color:white; text-align:center; }
  .btn {
    background:linear-gradient(45deg,#667eea,#764ba2); color:white; border:none;
    padding:11px 26px; border-radius:25px; font-size:1rem; cursor:pointer;
    transition:.25s; margin:8px;
  }
  .btn:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(102,126,234,.35); }
  .btn:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn.small { padding:8px 16px; font-size:.9rem; }
  .file-input { display:none; }
</style>
</head>
<body>
<div class="container">
  <h1>HandsUp</h1>

  <div class="status loading" id="backendStatus">Conectando con el backend...</div>

  <div class="panel">
    <h3>Modelo</h3>
    <div class="row">
      <label for="modelSelect">Modelo activo:</label>
      <select id="modelSelect" disabled>
        <option>Cargando modelos...</option>
      </select>
    </div>
    <div class="row">
      <label for="thresholdRange">Umbral de confianza:</label>
      <input type="range" id="thresholdRange" min="0.3" max="0.99" step="0.01" value="0.55">
      <span class="threshold-badge" id="thresholdValue">55%</span>
    </div>
  </div>

  <div class="panel">
    <h3>Imagenes de ejemplo (haz clic para probar)</h3>
    <div class="gallery" id="gallery">
      <div style="grid-column:1/-1;text-align:center;color:#888;padding:20px;">
        Cargando ejemplos...
      </div>
    </div>
    <div style="text-align:right;margin-top:10px;">
      <button class="btn small" id="reloadSamplesBtn" type="button">Recargar ejemplos</button>
    </div>
  </div>

  <div class="panel">
    <h3>Subir tu propia imagen</h3>
    <input type="file" id="imageFile" accept="image/*" class="file-input">
    <div class="upload-area disabled" id="uploadArea">
      <div class="upload-icon">[IMG]</div>
      <div class="upload-text">Haz clic o arrastra una imagen aqui</div>
      <div style="font-size:.85rem;color:#999;margin-top:6px;">JPG, PNG, GIF, WEBP</div>
    </div>
  </div>

  <div class="error" id="error"></div>
  <div class="success" id="success"></div>

  <div class="preview-container">
    <img id="previewImage" class="preview-image" alt="Vista previa" crossorigin="anonymous">
  </div>

  <div class="loading" id="loading">Procesando</div>

  <div class="result" id="result">
    <div class="result-letter" id="resultLetter">A</div>
    <div class="result-confidence" id="resultConfidence">Confianza: 95%</div>
    <div class="warning" id="warning"></div>
    <div class="metrics" id="metrics"></div>
  </div>

  <div style="text-align:center;margin-top:20px;">
    <button class="btn" id="resetBtn" disabled>Nueva imagen</button>
  </div>
</div>

<script>
const BACKEND = 'http://127.0.0.1:8000';

const els = {
  backendStatus: document.getElementById('backendStatus'),
  modelSelect: document.getElementById('modelSelect'),
  thresholdRange: document.getElementById('thresholdRange'),
  thresholdValue: document.getElementById('thresholdValue'),
  gallery: document.getElementById('gallery'),
  reloadSamplesBtn: document.getElementById('reloadSamplesBtn'),
  uploadArea: document.getElementById('uploadArea'),
  imageFile: document.getElementById('imageFile'),
  previewImage: document.getElementById('previewImage'),
  loading: document.getElementById('loading'),
  result: document.getElementById('result'),
  resultLetter: document.getElementById('resultLetter'),
  resultConfidence: document.getElementById('resultConfidence'),
  warning: document.getElementById('warning'),
  metrics: document.getElementById('metrics'),
  error: document.getElementById('error'),
  success: document.getElementById('success'),
  resetBtn: document.getElementById('resetBtn')
};

let threshold = 0.55;
let modelReady = false;

function showError(msg){ els.error.textContent=msg; els.error.style.display='block'; }
function showSuccess(msg){ els.success.textContent=msg; els.success.style.display='block'; }
function hideMessages(){ els.error.style.display='none'; els.success.style.display='none'; }
function showLoading(txt='Procesando'){ els.loading.textContent=txt; els.loading.style.display='block'; }
function hideLoading(){ els.loading.style.display='none'; }
function hideResult(){ els.result.style.display='none'; }

/* ---------- Backend ---------- */
async function connectBackend(){
  els.backendStatus.className='status loading';
  els.backendStatus.textContent='Conectando con el backend...';

  const deadline = Date.now() + 15000;
  let health=null;
  while (Date.now() < deadline){
    try {
      const r = await fetch(`${BACKEND}/health`);
      if (r.ok){ health = await r.json(); break; }
    } catch {}
    await new Promise(res=>setTimeout(res,500));
  }

  if (!health){
    els.backendStatus.className='status not-loaded';
    els.backendStatus.textContent='No se pudo conectar al backend (puerto 8000)';
    showError('El backend Python no esta corriendo. Inicia Electron de nuevo o ejecuta:\n  cd python-backend\n  .\\venv\\Scripts\\Activate.ps1\n  python src\\main.py');
    return;
  }

  modelReady = health.model==='loaded';
  els.backendStatus.className = modelReady ? 'status loaded' : 'status not-loaded';
  els.backendStatus.textContent = modelReady
    ? `Backend conectado - Modelo: ${health.current_model} - ${health.classes.length} clases`
    : 'Backend conectado pero sin modelo cargado';

  try {
    const r = await fetch(`${BACKEND}/models`);
    const data = await r.json();
    els.modelSelect.innerHTML='';
    data.available.forEach(m=>{
      const opt=document.createElement('option');
      opt.value=m.file;
      opt.textContent=m.name;
      if (m.file===data.current) opt.selected=true;
      els.modelSelect.appendChild(opt);
    });
    els.modelSelect.disabled = !data.available.length;
  } catch(e){
    showError('No se pudo obtener la lista de modelos: '+e.message);
  }

  if (modelReady){
    els.uploadArea.classList.remove('disabled');
  }

  loadSamples();
}

/* ---------- Galeria ---------- */
async function loadSamples(){
  els.gallery.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#888;padding:20px;">Cargando ejemplos...</div>';
  try {
    const r = await fetch(`${BACKEND}/samples`);
    if (!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    renderGallery(data.images || []);
  } catch(e){
    els.gallery.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#c82333;padding:20px;">
      No se pudieron cargar ejemplos: ${e.message}
    </div>`;
  }
}

function renderGallery(images){
  if (!images.length){
    els.gallery.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#888;padding:20px;">No hay imagenes de ejemplo en data/static/images</div>';
    return;
  }
  els.gallery.innerHTML='';
  images.forEach(img=>{
    const div=document.createElement('div');
    div.className='gallery-item';
    div.title = img.file;

    const el = document.createElement('img');
    el.alt = img.file;
    el.loading = 'lazy';
    el.crossOrigin = 'anonymous';
    el.src = `${BACKEND}${img.url}`;
    el.onerror = ()=>{
      div.classList.add('error');
      console.warn('No se pudo cargar miniatura:', img.file);
    };

    const label = document.createElement('div');
    label.className='label';
    label.textContent = img.file;

    div.appendChild(el);
    div.appendChild(label);

    div.addEventListener('click', ()=>{
      if (div.classList.contains('error')){
        showError('Esta imagen no se pudo cargar: '+img.file);
        return;
      }
      document.querySelectorAll('.gallery-item.selected')
        .forEach(x=>x.classList.remove('selected'));
      div.classList.add('selected');
      useSample(img);
    });

    els.gallery.appendChild(div);
  });
}

/* Carga la imagen de ejemplo en el <img> de preview y predice */
function useSample(img){
  if (!modelReady){ showError('Aun no hay modelo cargado'); return; }
  hideMessages(); hideResult();

  const url = `${BACKEND}${img.url}`;
  const tmp = new Image();
  tmp.crossOrigin = 'anonymous';
  tmp.onload = ()=>{
    els.previewImage.src = tmp.src;
    els.previewImage.style.display='block';
    setTimeout(()=>predictFromImgEl(), 50);
  };
  tmp.onerror = ()=>{
    showError('No se pudo cargar la imagen de ejemplo: '+img.file+
      '\nComprueba que el archivo existe en data\\static\\images y que el backend esta corriendo.');
  };
  tmp.src = url;
}

/* ---------- Subida propia ---------- */
els.uploadArea.addEventListener('click', ()=>{ if(modelReady) els.imageFile.click(); });
els.uploadArea.addEventListener('dragover', e=>{ if(!modelReady)return; e.preventDefault(); els.uploadArea.classList.add('dragover'); });
els.uploadArea.addEventListener('dragleave', ()=> els.uploadArea.classList.remove('dragover'));
els.uploadArea.addEventListener('drop', e=>{
  if(!modelReady) return;
  e.preventDefault(); els.uploadArea.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleImageFile(e.dataTransfer.files[0]);
});
els.imageFile.addEventListener('change', e=>{
  if (e.target.files.length) handleImageFile(e.target.files[0]);
});

function handleImageFile(file){
  if (!modelReady){ showError('Aun no hay modelo cargado'); return; }
  if (!file.type.startsWith('image/')){ showError('Selecciona un archivo de imagen valido'); return; }
  const reader=new FileReader();
  reader.onload = ev=>{
    document.querySelectorAll('.gallery-item.selected')
      .forEach(el=>el.classList.remove('selected'));
    els.previewImage.src = ev.target.result;
    els.previewImage.style.display='block';
    els.previewImage.onload = ()=> setTimeout(predictFromImgEl, 50);
  };
  reader.readAsDataURL(file);
}

/* ---------- Prediccion ---------- */
async function predictFromImgEl(){
  hideMessages(); hideResult();
  showLoading('Enviando al backend');
  els.resetBtn.disabled = true;
  try {
    const canvas = document.createElement('canvas');
    canvas.width  = els.previewImage.naturalWidth  || els.previewImage.width;
    canvas.height = els.previewImage.naturalHeight || els.previewImage.height;
    if (!canvas.width || !canvas.height){
      throw new Error('La imagen aun no esta cargada');
    }
    canvas.getContext('2d').drawImage(els.previewImage, 0, 0);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

    const r = await fetch(`${BACKEND}/predict`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ image: dataUrl })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error||'Error en prediccion');

    const letter = data.prediction;
    const conf = data.confidence;

    els.result.className = 'result' + (conf < threshold ? ' rejected' : '');
    els.resultLetter.textContent = conf < threshold ? '!' : letter;
    els.resultConfidence.textContent =
      `${letter} - Confianza: ${(conf*100).toFixed(1)}% - Modelo: ${data.model}`;

    const top = Object.entries(data.probabilities)
      .sort((a,b)=>b[1]-a[1]).slice(0,3);
    els.metrics.innerHTML = top.map(([k,v])=>
      `<div class="metric"><b>${k}</b>${(v*100).toFixed(1)}%</div>`
    ).join('');

    if (conf < threshold){
      els.warning.style.display='block';
      els.warning.innerHTML = `Confianza por debajo del umbral (${Math.round(threshold*100)}%).<br>Prueba con una imagen mas clara o cambia de modelo.`;
    } else {
      els.warning.style.display='none';
    }
    els.result.style.display='block';
    els.resetBtn.disabled=false;
  } catch(e){
    showError('Error al predecir: '+e.message);
    els.resetBtn.disabled=false;
    console.error(e);
  } finally {
    hideLoading();
  }
}

/* ---------- Cambio de modelo ---------- */
els.modelSelect.addEventListener('change', async ()=>{
  const model = els.modelSelect.value;
  els.modelSelect.disabled=true;
  showLoading('Cambiando modelo');
  try {
    const r = await fetch(`${BACKEND}/select-model`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error||'Error desconocido');
    modelReady=true;
    els.backendStatus.className='status loaded';
    els.backendStatus.textContent=`Modelo: ${data.current_model} - ${data.classes.length} clases`;
    showSuccess(`Modelo cambiado a ${data.current_model}`);
    setTimeout(hideMessages, 2500);
  } catch(e){
    showError('No se pudo cambiar el modelo: '+e.message);
    await connectBackend();
  } finally {
    hideLoading();
    els.modelSelect.disabled=false;
  }
});

/* ---------- Umbral ---------- */
els.thresholdRange.addEventListener('input', ()=>{
  threshold = parseFloat(els.thresholdRange.value);
  els.thresholdValue.textContent = Math.round(threshold*100)+'%';
});

/* ---------- Reset / recargar ---------- */
els.resetBtn.addEventListener('click', ()=>{
  els.previewImage.removeAttribute('src');
  els.previewImage.style.display='none';
  els.imageFile.value='';
  document.querySelectorAll('.gallery-item.selected')
    .forEach(el=>el.classList.remove('selected'));
  hideResult(); hideMessages();
});

els.reloadSamplesBtn.addEventListener('click', loadSamples);

/* ---------- Arranque ---------- */
connectBackend();
</script>
</body>
</html>
